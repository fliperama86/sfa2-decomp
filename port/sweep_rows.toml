function = "func_801b00d0_slot04_11"
function_address = 0x801b00d0
data_bytes = 8
evidence = "The last two words of a table of words that runs from 0x801b0000 and has the same shape in the entries before it; a pointer to this address stands in a data table of the module, and nothing branches into it. The function's first instruction, a stack frame, follows."

