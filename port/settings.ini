# Experimental changes are independent. All are on by default but arcade_assets, which needs the arcade set and is work in progress
# (port/arcade/README.md), and widescreen (port/widescreen.md), work in progress. arcade_intro needs an intro pack (port/intro/README.md;
# without one the PS1 opening plays). settings_menu is the in-game menu of the [display] settings below (port/settings-menu.md), which
# saves a change to this file at once.
[experimental]
pixel_perfect_ui = true
arcade_video = true
center_ui = true
fast_loads = true
memory_card = true
arcade_intro = true
arcade_assets = false
settings_menu = true
# The 384 x 224 picture drawn on a 512 x 224 canvas and shown at 16:9 (port/widescreen.md); work in progress.
widescreen = false
# With widescreen, a stage's ends: centred (the view as the game's, past the stage's art at the walls), anchored (the view shifted
# inside the stage there) or narrowed (the game's screen taken as 512 wide: the camera stops 64 short of each end and the fighters
# reach the wide view's edges, so the walls stay where they are).
wide_ends = narrowed

# How the picture is shown. The sizes are WxH in pixels, each side 320 to 16384.
[display]
screen = window            # window | fullscreen | borderless
window_size = 1280x960
fullscreen_size = desktop  # desktop | WxH
filter = sharp_bilinear    # nearest | bilinear | sharp_bilinear (nearest in a build without PsyZ)
# The old key sharp_bilinear = true|false of [experimental] is still read, as filter = sharp_bilinear|nearest; not together with filter.
