# The stand-alone programs of the disc that the game starts with Exec.
# Read by programs.py. The file of each program is the user's own copy, taken out
# of the user's disc image with discfile.py; it is private and never committed.

[[program]]
name = "logo"
file = "../../extract/programs/LOGO.EXE"
disc = "PAC/LOGO.EXE"
sha256 = "42f07130e1175a7a77ed8a71726ed4dfbcb4a4276ea0866a4e552ff95abd51e6"
address = 0x80010000
# The global pointer register as the program's entry code sets it before its main (the header's own field is 0).
# The reader checks the value against that code when it reads the file; the test tool begins each run with it.
gp = 0x8002eafc
functions = [
  { name = "func_80011758_logo", address = 0x80011758, size = 60 },
  { name = "func_80011838_logo", address = 0x80011838, size = 8 },
  { name = "func_80010f20_logo", address = 0x80010f20, size = 24 },
  { name = "func_80010a38_logo", address = 0x80010a38, size = 72 },
  { name = "func_80010f38_logo", address = 0x80010f38, size = 140 },
