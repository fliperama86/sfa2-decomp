# Matching-build configuration. Contract: ps1/docs/matching-build.md

[baseline]
executable = "../audit/files/SLPS_004.15"
sha256 = "0a522fd4791edfe95150edea057ca7113b8d0e93ed085be6854c042012c4a2a2"

[toolchain]
cpp = "clang"
maspsx = "~/Projects/references/maspsx/maspsx.py"
maspsx_commit = "e85ecb373828aabea96d7e6400974d4f91ce8c74"
# 2.21 or older: the original uses addiu and a nop in $at expansions.
aspsx_version = "2.21"
binutils_prefix = "mipsel-linux-gnu-"
include_dirs = ["sdk/include", "sdk/include/psxsdk"]
expand_div = true

# The pinned GCC 2.6.3 binary, run locally on this machine.
[toolchain.cc1]
kind = "local"
path = "../toolchain/cc1-psx-26"
sha256 = "c248a5272dc1a4537b177c71e3d785f48204718e36b076d5d7940b9469a0beb8"

[selftest]
unit = "metrics"
find = "for (slot = 11; slot != -1; --slot)"
replace = "for (slot = 10; slot != -1; --slot)"

