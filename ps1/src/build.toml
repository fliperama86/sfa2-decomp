# Module images: code that the resident loader copies from an archive to a
# fixed address. Contract: ps1/docs/matching-build.md, "Module images".
[overlays]
table_pointers = 0x8017eb1c

# The one content of slot 0x2a. It is in 63 archives; this is one of them.
[[image]]
name = "slot2a"
archive = "../extract/PAC/BOSS00.PAC"
slot = 0x2a
sha256 = "952ab02df2db28319faf3c349a183a4b293df3a09295ddaa0703e054092791f4"
address = 0x801e0000

# The one content of slot 0x16, an extra module of two characters. It is in
# PL11.PAC and PL13.PAC; this is one of them.
[[image]]
name = "slot16"
archive = "../extract/PAC/PL11.PAC"
slot = 0x16
sha256 = "f7e738da311429fa671148eb15742fbe8c70bbadc20c23badd85898e55c773f5"
address = 0x8007bc00

# The one content of slot 0x17. It is in PL11X.PAC and PL13X.PAC; this is one
# of them. It is declared as like `slot16`: the units of `slot16` are linked a
# second time at this address and compared with this chunk. Three names of
# `symbols.ld` lie outside both images and have another address on this side.
[[image]]
name = "slot17"
like = "slot16"
archive = "../extract/PAC/PL11X.PAC"
slot = 0x17
sha256 = "25c3a665f04b198f2ff6bea63cdbb768249d68dadc0f765d132d49f4b638173e"
address = 0x8008bf00

[image.symbols]
func_801b606c = 0x801ce06c
func_801b63fc = 0x801ce3fc
overlay_left_kind = 0x801cdab8

# The one content of slot 0xb, a module that the second-side character files
# carry. It is in 24 archives; this is one of them. It loads at the address of
# `slot2a` and is another module.
[[image]]
name = "slot0b"
