# Which files each control file of the port is about. `workflow.py review` reads this (review.py, port_controls): a changed
# file of `port/` selects the control files that name it, instead of all of them. Written by reading each control file's
# own header; it is a reviewed list, not a derived one.
#
# The rules, all of which err to the wide side:
#   - a control file is always about itself and about every Python file of `port/tools` that it imports, directly or
#     through another (the tool it tests, a rig or a made-up image of another control file): those are read from its
#     text and are not listed here;
#   - a tool that a control file runs as a separate program and does not import, and a file of the tree that it reads,
#     ARE listed here: nothing reads those from its text (`test_hostcheck.py` runs `hostcheck.py` by its path);
#   - an entry that ends in `/` names everything below that folder;
#   - a control file that has no line here is selected by every change of the port;
#   - a changed file that no control file names, and that is not under [build], selects every control file;
#   - a path listed here that is not in the tree, and a line for a control file that is not there, stop the review.
#
# One judgment, stated: `test_hostlaunch.py` owns the rig that other control files run their own cases on. It is listed
# for every runtime file that the rig links (its RUNTIME list) and for `port.h`, so a change of any of them runs the
# rig's own launch cases, where a missing stand-in or a broken link shows. The control files that use the rig are
# listed only for the files their own cases are about.

[controls]
