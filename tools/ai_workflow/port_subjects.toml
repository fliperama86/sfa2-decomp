# Which files each control file of the port is about. `workflow.py review` reads this (review.py, port_controls): a changed
# file of `port/` selects the control files that name it, instead of all of them. Written by reading each control file's
# own header; it is a reviewed list, not a derived one.
#
# The rules, all of which err to the wide side:
#   - a control file is always about itself and about every Python file of `port/tools` that it imports, directly or
#     through another (the tool it tests, a rig or a made-up image of another control file): those are read from its
#     text and are not listed here;
#   - a tool that a control file runs as a separate program and does not import, and a file of the tree that it reads,
#     ARE listed here: nothing reads those from its text (`test_hostcheck.py` runs `hostcheck.py` by its path);
#   - an entry that ends in `/` names everything below that folder;
#   - a control file that has no line here is selected by every change of the port;
#   - a changed file that no control file names, and that is not under [build], selects every control file;
#   - a path listed here that is not in the tree, and a line for a control file that is not there, stop the review.
#
# One judgment, stated: `test_hostlaunch.py` owns the rig that other control files run their own cases on. It is listed
# for every runtime file that the rig links (its RUNTIME list) and for `port.h`, so a change of any of them runs the
# rig's own launch cases, where a missing stand-in or a broken link shows. The control files that use the rig are
# listed only for the files their own cases are about.

[controls]
test_intro_assets = ["port/intro/assets.py"]
test_intro_animation = ["port/intro/animation.py", "port/intro/assets.py"]
test_build_sh = []   # about `build.sh` at the root of the tree, which is not a file of `port/`: it runs stand-ins and reads no file of the port
test_hostaudio = ["port/src/iopage.c", "port/src/cd.c", "port/src/cd.h", "port/src/main.c", "port/psyz.patch"]
test_hostbuild = ["port/programs.toml", "port/src/port_tables.h"]
test_hostcd = ["port/src/cd.c", "port/src/cd.h", "port/src/disc.c", "port/src/sha256.c", "port/src/xa.c", "port/src/xa.h"]
test_hostcheck = ["port/tools/hostcheck.py"]
test_hostcheck_stop = ["port/tools/hostcheck.py"]
test_hostfixtures = ["port/replay/"]
test_hostgpu = ["port/src/gpu.c", "port/src/gpu.h", "port/psyz.patch"]
test_hostiopage = ["port/src/iopage.c", "port/src/mirror.c", "port/psyz.patch"]
test_hostkernel_start = ["port/src/kernel.c", "port/src/port.h"]
test_hostlaunch = [
    "port/src/port.h", "port/src/port_tables.h", "port/src/guest.h",
    "port/src/main.c", "port/src/memory.c", "port/src/disc.c", "port/src/jumps.c", "port/src/sha256.c", "port/src/library.c",
    "port/src/settings.c", "port/src/settings.h",
    "port/src/kernel.c", "port/src/threads.c", "port/src/overrides.c", "port/src/clib.c", "port/src/sound.c", "port/src/card.c", "port/src/memcard.c", "port/src/memcard.h",
    "port/src/cd.c", "port/src/cd.h", "port/src/xa.c", "port/src/xa.h", "port/src/modules.c", "port/src/modules.h",
    "port/src/debug.c", "port/src/interrupt.c", "port/src/mirror.c", "port/src/mirror.h", "port/src/mirrorcore.c",
    "port/src/iopage.c", "port/src/input.c", "port/src/programs.c", "port/src/programs.h",
]
test_hostloadwait = [
    "port/src/loadwait.c", "port/src/loadwait.h", "port/src/port.h", "port/src/port_tables.h", "port/src/settings.h", "port/src/guest.h",
    "port/src/cd.h",
]
test_hostmemcard = ["port/src/card.c", "port/src/memcard.c", "port/src/memcard.h", "port/src/port.h", "port/src/guest.h"]
test_hostmdec = ["port/src/mdec.c", "port/src/mdec.h"]
test_hostmirror = ["port/src/mirror.c", "port/src/mirror.h", "port/src/mirrorcore.c", "port/tools/mirror_native_test.c"]
test_hostmodules = ["port/src/modules.c", "port/src/modules.h"]
test_hostneeds = ["port/tools/hostneeds.py"]
test_hostpads = ["port/src/input.c", "port/src/kernel.c", "port/psyz.patch"]
test_hostpress = ["port/src/press.c", "port/src/press.h", "port/src/mdec.c", "port/src/mdec.h", "port/psyz.patch"]
test_hostprogcalls = [
    "port/src/progcalls.c", "port/src/progcalls.h", "port/src/cd.c", "port/src/cd.h", "port/src/disc.c", "port/src/input.c",
    "port/src/sha256.c", "port/src/xa.c", "port/src/xa.h",
]
test_hostprograms = [
    "port/src/programs.c", "port/src/programs.h", "port/src/overrides.c", "port/src/disc.c", "port/src/sha256.c",
    "port/src/port_tables.h",
]
test_hostreplay = ["port/replay/"]
test_hostrun = ["port/src/disc.c", "port/src/jumps.c", "port/src/library.c", "port/src/sha256.c", "port/src/port.h", "port/src/port_tables.h"]
test_hoststream = [
    "port/src/stream.c", "port/src/stream.h", "port/src/press.h", "port/src/cd.c", "port/src/cd.h", "port/src/disc.c",
    "port/src/sha256.c", "port/src/xa.c", "port/src/xa.h",
]
test_hostxa = ["port/src/xa.c", "port/src/xa.h"]
# The macOS program's build: macbuild.py (read from the text) and the files of the platform layer that its syntax check compiles on a Mac.
test_macbuild = ["port/mac/platform.c", "port/mac/platform.h", "port/mac/guest.c", "port/mac/vm.entitlements"]
# The comparison of the Windows objects before and after a change: objcheck.py, read from the text.
test_objcheck = []
# The macOS guest image: the control file is about its own tool (guestlink.py) and what it imports (hostbuild.py), read from its text.
test_guestlink = []
# The machine of the macOS build (it runs on Apple Silicon only: MAC_ONLY in review.py). The tools it imports are read from its text.
test_vm = [
    "port/mac/vm.c", "port/mac/vm.h", "port/mac/elf.c", "port/mac/elf.h", "port/mac/vm.entitlements",
    "port/mac/test/guest.c", "port/mac/test/vmtest.c",
]
test_libgap = ["port/tools/libgap.py"]
# The patch of the picture library: the control file of the tool that applies it reads the tree's own copy, and the six
# control files that take a build of the library (`--psyz-build`) run on what the patch made.
test_psyzbuild = ["port/psyz.patch"]
test_sdkshim = ["port/sdkshim/", "port/psyz.patch"]
test_settings = ["port/src/settings.c", "port/src/settings.h", "port/src/main.c", "port/settings.ini", "port/tools/settings_test.c"]
test_video = ["port/src/video.h", "port/src/gpu.c", "port/psyz.patch", "port/tools/video_test.c", "port/tools/video_gpu_test.c", "port/tools/video_bridge_test.c"]

test_ui_layout = ["port/src/ui_layout.h", "port/src/video.h", "port/src/gpu.c", "port/src/gpu.h", "port/tools/ui_layout_test.c", "port/tools/ui_layout_seam_test.c", "port/tools/ui_layout_gpu_test.c"]

# Files of the port whose check is the build of the PC program alone (`native-build`, which every change of the port that
# is not a control file gets): no control file reads the tree's own copy of them. The overrides have their own checks
# besides (the differential test of each, selected elsewhere in review.py).
[build]
only = ["port/overrides/", "port/sweep_rows.toml"]
